label.ck{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}

label.ck:has(input:checked) span{text-decoration:line-through;color:var(--mute)}

summary::before{content:"+";color:var(--leaf);font-weight:800;width:14px}details[open] summary::before{content:"–"}
details>div{padding:0 18px 14px 44px}
.tag{display:inline-block;font-size:14px;padding:1px 9px;border-radius:99px;background:var(--tint);color:var(--teal);font-weight:600}
.warn{border-left:5px solid var(--gold);background:var(--tint);padding:12px 16px;border-radius:8px;margin:14px 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}

h3{font-size:21px;margin-top:24px}

beranda:["Beranda",()=>`<div class="hero"><i class="bl b1"></i><i class="bl b2"></i><div class="hl"><h2>Persiapan WHV Australia</h2><p>Panduan, dokumen, dan checklist Working Holiday Visa dalam satu tempat. Centang yang sudah selesai, progresmu tersimpan di browser ini.</p><div class="cta"><a class="bt w" href="#ballot">Mulai dari ballot</a><a class="bt" href="#dokumen">Cek dokumen</a></div><div class="chips"><span>Biaya ballot AUD 25</span><span>8 langkah daftar</span><span>3 dokumen wajib terjemah</span><span>8 langkah hari pertama</span></div></div><div class="rw"><div class="ring" id="ring"><span id="pct">0%</span></div><small>Progres checklist</small></div></div>
<h3>Perjalananmu</h3><div class="tl">${[["ballot","Daftar ballot","Bayar AUD 25"],["dokumen","Siapkan dokumen","Terjemahan resmi"],["ballot","Ajukan visa","Jika selected"],["tiba","Tiba di Australia","SIM, bank, TFN"],["kerja","Cari kerja","Lamar banyak"]].map(s=>`<a href="#${s[0]}"><b>${I(s[0])}</b><strong>${s[1]}</strong><small>${s[2]}</small></a>`).join("")}</div>
<h3>Akses cepat</h3><div class="grid">${[["ballot","Daftar ballot","8 langkah dari login ImmiAccount sampai status received."],["dokumen","Dokumen","Mana yang wajib diterjemahkan, opsional, dan tidak perlu."],["kerja","Cari kerja","Aplikasi, grup, agen, dan tips CV kerja fisik."],["tiba","Hari pertama","SIM, bank, TFN, Opal, super, dan RSA."],["bawaan","Barang bawaan","Pakaian, obat, perlengkapan mandi, dan makanan."],["alat","Alat dan tautan","Kalkulator WHV, Jalur Kerja Aussie, situs resmi."]].map(c=>`<div class="card"><h3>${c[1]}</h3><p>${c[2]}</p><a href="#${c[0]}">Buka halaman</a></div>`).join("")}</div>
<div class="warn">Isi halaman ini dirangkum dari file panduan yang kamu kumpulkan. Biaya dan aturan bisa berubah, jadi cek ulang di situs resmi Home Affairs sebelum bayar atau submit.</div>`],
ballot:["Daftar ballot",()=>`<h2>Pendaftaran ballot WHV (subclass 462)</h2><p class="lead">Dari login sampai berkas berstatus received. Siapkan dokumen dan metode pembayaran sebelum ballot dibuka, dan pastikan semua data benar sebelum submit.</p>
<h3>Langkah pendaftaran</h3>
${D("1. Login ImmiAccount",U([`Buka ${L("https://immi.homeaffairs.gov.au","immi.homeaffairs.gov.au")}, lalu klik ImmiAccount di menu atas.`,"Masukkan username dan password, lalu klik Login. Lupa akun? Pakai tautan “I have forgotten my username/password”.","Belum punya akun? Pilih Create an ImmiAccount.","Sebelum ada aplikasi, halaman My applications masih kosong."]),1)}
${D("2. Buat aplikasi baru",U(["Klik New application.","Pilih Visa pre-application registration.","Pilih Registration - Work and Holiday Visa (462). Di daftar yang sama ada Pacific Engagement Visa (192) dan MATES (403), jangan sampai salah pilih."]))}
${D("3. Centang pernyataan privasi",U(["Kamu masuk ke Registration for a First Work and Holiday Visa. Periksa datamu: tidak bisa diubah sampai pembayaran diterima, dan setelah bayar hanya sebagian data yang bisa diperbarui.","Baca Privacy policy dan Security statement, centang kedua kotak (kamu bisa dihubungi nanti untuk riset dan evaluasi program), lalu klik Next."]))}
${D("4. Isi Your details",U(["Isi persis seperti paspor pribadi: Family name, Given names, Sex, Date of birth, Passport number, Country of passport (Indonesia), tanggal terbit, dan tanggal habis.","Kalau terpilih, data di aplikasi visa harus sama dengan data registrasi ini.","Bingung menulis nama? Ada tautan help page untuk family dan given names di halaman itu."]))}
${D("5. Centang Declarations",U(["Belum pernah memegang visa 462 yang sudah dipakai masuk ke Australia.","Kamu yakin memenuhi syarat visa 462.","Kamu menerima komunikasi elektronik dan paham bisa saja tidak terpilih.","Kalau terpilih, kamu akan diberi tahu lewat email.","Informasi lengkap, benar, dan memberi informasi palsu adalah pelanggaran.","Kamu akan memperbarui registrasi bila paspor atau kontak berubah.","Pembayaran tidak menjamin terpilih di ballot.","Pembayaran tidak bisa direfund, bahkan jika registrasi tidak berhasil."])+"<p>Setelah semua dicentang, klik Pay and Submit. Masih ada yang salah? Klik Edit details dulu.</p>")}
${D("6. Pilih metode dan selesaikan pembayaran","Biaya registrasi AUD 25. Pilih kartu debit/kredit, PayPal, UnionPay, atau BPAY, lalu ikuti alurnya (detail di bawah). Jangan tutup, kembali, atau refresh halaman saat pembayaran diproses.")}
${D("7. Cek status dan konfirmasi",U(["Status Ready for payment berarti kamu belum ikut random selection sampai pembayaran diterima. Cek tab My payments.","Setelah bayar, email dari Department of Home Affairs masuk sebagai bukti. Tidak ada di inbox? Cek folder spam.","Cek status: login ImmiAccount, buka My applications, lihat bagian Status.","received: pembayaran diterima dan kamu ikut undian. Ini bukan berarti sudah dapat visa.","selected: kamu terpilih dan diundang lanjut mengajukan visa. Ikuti instruksi email dan selesaikan sebelum batas waktu.","Undian bisa berlangsung beberapa waktu, jadi pastikan email dan ImmiAccount selalu aktif.","Simpan screenshot halaman Registration submitted sebagai bukti."]))}
${D("Perbarui data saat menunggu",U(["Ganti email? Wajib perbarui registrasi supaya kabar seleksi sampai.","Dapat paspor baru? Perbarui registrasi dengan paspor baru.","Kalau terpilih, paspor harus masih berlaku.","Perbarui lewat tautan Update registration di ImmiAccount."]))}
<h3>Metode pembayaran</h3><div class="card scroll"><table><tr><th>Metode</th><th>Surcharge</th><th>Total</th></tr>
${[["Visa / Mastercard",1.40],["PayPal",1.01],["UnionPay",1.90]].map(m=>`<tr><td>${m[0]}</td><td>${m[1].toFixed(2)}%</td><td>AUD ${(25*(1+m[1]/100)).toFixed(2)}</td></tr>`).join("")}<tr><td>BPAY</td><td>-</td><td>AUD 25.00</td></tr></table>
<p style="color:var(--mute);margin:10px 0 0">Dibayar dalam AUD. Bank penerbit kartu bisa menambah biaya konversi, dan total bisa sedikit berubah karena kurs. Untuk pendaftar dari Indonesia, kartu atau PayPal biasanya paling praktis.</p></div>
${D("Kartu debit/kredit (paling mudah)",U(["Pastikan kartu mendukung transaksi online internasional dan 3D Secure. Surcharge 1,40% (AUD 0,35), total AUD 25,35.","Pilih Debit/credit card lalu Submit. Baca informasi konfirmasi, klik Submit lagi.","Di Secure Checkout ada hitung mundur sekitar 10 menit. Isi nama pemegang kartu, nomor kartu, expiry, CVV, alamat pemegang kartu (alamat, kota, provinsi, kode pos, negara), dan email.","Klik Pay. Masukkan kode OTP dari bank (SMS atau email terdaftar). Halaman habis waktu setelah 5 menit; klik RESEND jika kode tidak muncul, dan hubungi bank bila tetap gagal.","Halaman Registration submitted muncul. Simpan screenshot."]))}
${D("PayPal",U(["Surcharge 1,01%, total sekitar AUD 25,25.","Pilih PayPal lalu Submit. Kamu diarahkan ke halaman login PayPal.","Pilih sumber dana: saldo PayPal, kartu debit/kredit, atau tambah kartu. Pastikan saldo cukup.","Cek ringkasan dan biaya PayPal, klik Pay Now. Kamu kembali otomatis ke ImmiAccount, pastikan muncul Registration submitted."]))}
${D("UnionPay",U(["Surcharge 1,90%, total sekitar AUD 25,48.","Untuk pemegang kartu UnionPay. Pastikan kartu aktif untuk transaksi internasional."]))}
${D("BPAY",U(["Hanya untuk rekening bank di Australia.","Setelah memilih BPAY, pembayaran harus dilakukan dalam 3 hari.","Status bisa tetap Awaiting payment sampai pembayaran dicocokkan (sekitar 1 hari).","Registrasi baru masuk putaran seleksi setelah pembayaran beres lewat bankmu."]))}`],
dokumen:["Dokumen",()=>`<h2>Checklist dokumen</h2><p class="lead">Semua dokumen yang bukan berbahasa Inggris harus diterjemahkan. Unggah dokumen asli dan hasil terjemahannya.</p>
<div class="grid"><div class="card"><span class="tag">Wajib diterjemahkan</span>${list("d",["Ijazah / surat keterangan lulus / surat mahasiswa aktif","Transkrip nilai","KTP (depan dan belakang)"])}</div>

${D("Dokumen opsional: kapan dipakai",U(["Akta kelahiran: dilampirkan jika diminta imigrasi atau untuk verifikasi identitas.","Kartu keluarga: jika diminta atau untuk menunjukkan hubungan keluarga.","SKCK: tidak wajib untuk WHV Australia, boleh dilampirkan jika sudah punya.","Semua dokumen yang kamu unggah, termasuk yang opsional, harus diterjemahkan jika bukan berbahasa Inggris."]))}
${D("Kenapa sebagian tidak perlu diterjemahkan","Paspor sudah bilingual (Indonesia dan Inggris). Surat referensi bank serta sertifikat IELTS/PTE sudah berbahasa Inggris, jadi diterima dalam bahasa aslinya.")}
<h3>Penerjemah</h3><div class="card"><p style="margin-top:0">One-Tap Online Services: Instagram @1tap_services, atau WhatsApp +62 819 1616 3691 (nomor di flyer). Lewat Instagram ada testimoni dan hasil visa kliennya.</p><p style="margin-bottom:0;color:var(--mute)">Daftar DFAT di bawah hanya informasi, bukan rekomendasi. Cek sendiri kualitas dan biayanya.</p></div>
${D("Daftar penerjemah Indonesia (DFAT)",`<div class="scroll"><table><tr><th>Nama</th><th>Kota</th><th>Kontak</th></tr>${TR.map(r=>{const a=r.split("|");return `<tr><td>${a[0]}${a[4]=="1"?` <span class="tag">NAATI</span>`:""}</td><td>${a[1]}</td><td>${a[2]}<br><small>${a[3]}</small></td></tr>`}).join("")}</table></div>`)}`],
kerja:["Cari kerja",()=>`<h2>Strategi cari kerja</h2><p class="lead">Jangan andalkan satu cara. Gabungkan beberapa jalur sekaligus dan ulangi secara berkala. Visa WHV hanya izin tinggal dan bekerja; pekerjaannya kamu cari sendiri, dan jenisnya harus sesuai ketentuan visa.</p>
${D("Estimasi waktu dan peluang",U(["Sangat mungkin cepat dapat kerja, ada yang beberapa hari sudah diterima, tapi ini jarang.","Rata-rata tidak menganggur lebih dari 2 minggu, karena banyak perusahaan merekrut casual sekitar 2 minggu sekali.","Contoh pengalaman: dapat panggilan interview di minggu kedua, bahkan sempat ditolak karena jarak dan lokasi."]),1)}
${D("Siapkan sebelum cari kerja",U(["Mulai setelah visa granted, punya rekening bank, TFN, dan nomor telepon Australia, karena perusahaan biasanya menghubungi lewat SMS atau telepon.","Buat satu CV khusus kerja fisik dan satu CV umum.","Latihan interview telepon dengan bahasa Inggris sederhana.","Siapkan dokumen penting: paspor, visa, sertifikat.","Pastikan hak kerja aktif sesuai status visa.","Riset perusahaan dan daftar lowongan dari Indonesia."]))}
${D("1. Aplikasi pencari kerja",U(["SEEK: unduh, buat akun, lengkapi profil dengan alamat di Australia, lalu cari dan apply. Cek setiap hari.","Jora dan Gumtree: cari lokasi, jenis kerja, dan rate. Jora dan SEEK cocok untuk kerja di kota besar, terutama hospitality.","Airtasker: pekerjaan lepas atau panggilan.","Minimal apply ke 20 perusahaan, jangan berhenti di 5. Ulangi lamaran seminggu sekali atau tiga hari sekali.","Hindari agensi atau lowongan yang minta bayaran di awal."]))}
${D("2. Door to door",U(["Cetak CV, datangi tempat usaha satu per satu, tanyakan apakah sedang buka lowongan.","Tanya meski tidak ada tulisan “we’re hiring”. Jangan malu atau malas jalan; sekalian mengenal daerah sekitarmu.","Serahkan CV ke staf, manajer, atau supervisor, atau ngobrol langsung.","Di depan toko sering ada poster lowongan (slayer) dengan barcode atau email HRD.","Berpakaian rapi, sopan, ramah, dan tunjukkan kamu siap bekerja."]))}
${D("3. Telepon dan SMS",U(["Cari restoran, toko, atau perusahaan di Google Maps, lalu langsung telepon atau SMS.","Harus berani, lugas, dan jangan bertele-tele."]))}
${D("4. Email",U(["Subjek: “Process Worker” agar mudah dikirim ke banyak perusahaan.","Isi: sapaan, semangat kerja, kesiapan memberikan yang terbaik, dan kualifikasi.","Tutup dengan Warm/Best regards, nama lengkap, nomor HP, dan email."]))}
${D("5. Website perusahaan",U(["Buka website resmi, cari menu Careers atau Jobs, lihat posisi dan kualifikasi, lalu isi formulir online.","Contoh: halaman Careers di website McDonald’s Australia.","Selalu pegang HP karena panggilan interview atau feedback bisa lewat email atau telepon."]))}
${D("6. Grup Facebook, WhatsApp, Instagram",U(["Facebook: THE ROCK Indonesia, The Rock Perth (kota besar), Tasmania Backpackers, Job in Australia, Indonesian Community Australia, Local Jobs Australia, Work & Travel Australia. Untuk farm, cari misalnya “Emerald job”.","WhatsApp: perlu relasi untuk masuk, dan grupnya cepat berganti.","Instagram: DM bisnis lokal (restoran, kafe, hotel) dengan pesan singkat. Contoh: “Hi! I’m interested in any job opportunities at your business. Could you please let me know if you’re hiring? Thank you!”","Rekomendasi dari mulut ke mulut paling ampuh. Banyak lowongan farm dan hospitality tidak diposting di mana pun."]))}
${D("7. Agen rekrutmen",U(["Agen menyalurkan pekerja ke perusahaan rekanan: logistik, warehouse, konstruksi, pertanian, restoran, dan lainnya.","Agree Labour dan AgriLabour Australia lebih banyak ke pertanian. AgriLabour cocok untuk farm dan mengumpulkan payslip (pilih negara bagian: QLD, NSW, WA, VIC, NT, SA, TAS, ACT).","Tidak harus lewat agen, kamu juga bisa langsung apply lewat website, email, atau telepon."]))}
${D("8. Cadangan: ojek makanan",U(["UberEats, DoorDash, Menulog, Panda, atau aplikasi lain.","Daftar hari ini, besok bisa langsung dapat orderan dan penghasilan."]))}
<h3>CV untuk kerja fisik</h3>
${D("Isi dan struktur CV",U(["Urutan yang dipakai: Profile summary, Availability, Residency status (Work and Holiday Visa subclass 462, tanggal berlaku), Experience, Education, Key skills, Certificate atau English proficiency, lalu Additional information.","Judul CV bisa berupa target pekerjaan, misalnya General Worker | Food Production | Packing | Warehouse, plus lokasi dan status visa.","Pengalaman kantoran kurang relevan. Tonjolkan manual handling: menyusun barang, packing, bersih-bersih, mengangkat kardus atau beras.","Tiga kata kunci di profil: Hard working, Fast learner, Strong team effort.","Meat factory dan warehouse mencari yang kuat fisik: mengangkat 10 sampai 25 kg, tahan berdiri atau duduk lama, tahan suhu dingin.","Pengalaman yang bisa ditulis: helper gudang, pekerja kebun/farm, kitchen hand, general labourer, kafe/customer service. Boleh pengalaman membantu teman atau keluarga walau hanya 3 hari.","Jangan kosongkan CV, tapi jangan mengaku pengalaman yang tidak ada. Cantumkan “References available upon request”."]))}
<div class="warn">Pekerja WHV satu pekerjaan disebut berpenghasilan sekitar 30 sampai 45 juta rupiah per bulan; double job bisa lebih tinggi tapi kurang tidur. Ini gambaran dari satu pengalaman dan tergantung lokasi, musim, pengalaman, dan jenis pekerjaan. Riset perusahaan lebih dulu: cek lokasi di Google, baca review, pastikan eligible untuk perpanjangan visa, dan tanya di grup komunitas.</div>
<div class="warn">Waspada penipuan: jangan bayar biaya rekrutmen yang mencurigakan, hindari agensi yang minta bayaran di awal, dan curigai janji kerja instan.</div>
<p>Video penjelasan: ${L("https://www.youtube.com/watch?v=huD-M1xz2LY","cara cepat dapat kerja")}, ${L("https://www.youtube.com/watch?v=59DD9qY9Yr0","panduan cari kerja")}, ${L("https://www.youtube.com/watch?v=tpyxb6RcUUs","tips gampang diterima")}.</p>`],
tiba:["Hari pertama",()=>`<h2>Langkah pertama di Australia</h2><p class="lead">Urutan dari bandara sampai siap kerja. Centang yang sudah beres, lalu buka detailnya di bawah.</p><div class="card">${list("a",arrive)}</div>
${D("SIM card",U(["Beli begitu sampai di bandara supaya tetap punya internet. Pilihan: Vodafone, Optus, Telstra.","Paket mulai sekitar AUD 15 sampai 300, tergantung paket.","Sinyal Telstra biasanya paling bagus tapi lebih mahal."]),1)}
${D("Ke tempat tinggal",U(["Disarankan Uber atau DiDi, lebih aman dan nyaman saat bawa banyak barang.","Jangan pakai transport umum dulu karena barang bawaan banyak dan kamu masih baru."]))}
${D("Rekening bank",U(["Cari bank terdekat lewat Google: Commonwealth Bank, ANZ, NAB, dan lainnya.","Bawa paspor (wajib) dan uang tunai untuk deposit. Cukup datang ke bank.","Setelah aktif, minta petugas menghubungkan kartu ke HP agar bisa bayar pakai Apple Pay, Google Pay, atau Apple Watch."]))}
${D("Kartu Opal (transportasi publik NSW)",U(["Untuk naik kereta, bus, dan transport umum lainnya. Dijual di 7-Eleven, minimarket, dan toko lain.","Harga kartu biasanya AUD 20 dan langsung bisa dipakai; isi saldo di dalamnya.","Tap masuk dan tap keluar. Lupa tap bisa kena denda sekitar AUD 200."]))}
${D("TFN (Tax File Number)",U(["Nomor pajak yang wajib untuk bekerja di Australia, juga untuk pajak dan urusan administrasi.","Daftar online lewat situs resmi ATO (Australian Taxation Office). Bisa gratis, sesuai status visa dan kelayakanmu."]))}
${D("Superannuation",U(["Tabungan pensiun yang dibayar pemberi kerja.","Saat mulai bekerja, tanyakan ke HR atau payroll untuk mengaktifkannya.","Dananya tersimpan dan bisa diambil setelah kamu tidak bekerja lagi di Australia (setelah usia tertentu). Cukup pastikan sudah diaktifkan tempat kerja."]))}
${D("Asuransi kesehatan (OSHC, opsional tapi disarankan)",U(["OSHC biasanya untuk pelajar, tapi pemegang WHV juga bisa memilih asuransi kesehatan swasta.","Menanggung biaya dokter, rumah sakit, dan obat-obatan. Penyedia: Bupa, Allianz, Medibank, dan lainnya.","Sesuaikan dengan kebutuhan, jenis pekerjaan, dan anggaran."]))}
${D("RSA (Responsible Service of Alcohol)",U(["Wajib untuk bekerja di bar, restoran, kafe, atau tempat yang menjual alkohol.","Bisa dilakukan online atau di tempat pelatihan resmi. Biaya sekitar AUD 40 sampai 70.","Sertifikat berlaku di seluruh Australia, biasanya 3 tahun."]))}
${D("Tips tambahan",U(["Atur waktu kerja agar tetap ada waktu istirahat, mengurus administrasi, dan eksplorasi.","Siapkan uang tunai di awal (deposit, transport, dan lainnya).","Simpan dokumen penting (paspor, visa, rekening, asuransi, TFN) di tempat yang aman.","Jaga kesehatan, makan, dan tetap nikmati prosesnya."]))}`],
bawaan:["Barang bawaan",()=>`<h2>Yang dibawa dari Indonesia</h2><p class="lead">Bawa yang penting saja, jangan berlebihan karena makan tempat dan berat. Sesuaikan pakaian dengan musim di Australia (4 musim): jangan bawa pakaian musim panas kalau datang saat musim dingin, dan sebaliknya.</p>
<div class="grid">${Object.entries(pack).map(([k,v])=>`<div class="card"><h3>${k}</h3>${list("b"+k,v)}</div>`).join("")}</div>
<h3>Contoh harga di Indonesia</h3><div class="card scroll"><table><tr><th>Barang</th><th>Perkiraan</th></tr><tr><td>Long john + celana</td><td>Rp100.000</td></tr><tr><td>Sepatu safety</td><td>Rp400.000</td></tr><tr><td>Jaket (Kmart, baru)</td><td>Rp250.000</td></tr><tr><td>Jaket (marketplace, bekas)</td><td>Rp200.000</td></tr></table></div>
${D("Tips belanja",U(["Belum tahu nanti kerja di mana? Bawa yang serbaguna.","Beberapa barang jauh lebih murah di Indonesia, terutama sepatu, jaket, dan pakaian; harga di Australia bisa lebih mahal.","Manfaatkan marketplace Facebook untuk barang second hand yang masih bagus, atau kunjungi Kmart.","Makanan dan bumbu khas Indonesia membantu mengurangi rasa kangen dan lebih hemat.","Cek aturan karantina dan bea cukai Australia untuk makanan, tanaman, dan obat sebelum berangkat."]),1)}`],

const nav=document.getElementById("nav"),main=document.getElementById("main");
for(const k in S){nav.insertAdjacentHTML("beforeend",`<a href="#${k}" data-s="${k}">${I(k)}${S[k][0]}</a>`);main.insertAdjacentHTML("beforeend",`<section id="${k}">${S[k][1]()}</section>`)}
const badge=k=>`<span class="ico">${I(k)}</span>`;
for(const k in S){const h=document.querySelector("#"+k+" h2");if(h)h.insertAdjacentHTML("afterbegin",badge(k))}

let st={};try{st=JSON.parse(localStorage.getItem("whv")||"{}")}catch(e){}
const boxes=[...document.querySelectorAll("input[data-k]")];
function prog(){const n=boxes.filter(b=>b.checked).length,p=Math.round(100*n/boxes.length);document.getElementById("ring").style.setProperty("--p",p);document.getElementById("pct").textContent=p+"%"}
boxes.forEach(b=>{b.checked=!!st[b.dataset.k];b.addEventListener("change",()=>{st[b.dataset.k]=b.checked;try{localStorage.setItem("whv",JSON.stringify(st))}catch(e){}prog()})});prog();
function route(){const h=location.hash.slice(1);const k=S[h]?h:"beranda";document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===k));nav.querySelectorAll("a").forEach(a=>a.toggleAttribute("aria-current",a.dataset.s===k));const ca=nav.querySelector("[aria-current]");if(ca&&ca.scrollIntoView)ca.scrollIntoView({inline:"center",block:"nearest"});if(S[h])window.scrollTo(0,0)}
addEventListener("hashchange",route);route();
